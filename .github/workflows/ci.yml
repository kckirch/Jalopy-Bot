name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 22.x
          - 24.x

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  quality:
    # Keep this stable because branch protection requires this exact check name.
    name: Coverage thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce coverage minimums
        run: npm run test:coverage

      - name: Run lint
        run: npm run lint

      - name: Reject unused files, dependencies, and exports
        run: npm run check:dead-code

      - name: Reject production-only dead code
        run: npm run check:dead-code:production

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject tracked runtime data
        shell: bash
        run: |
          tracked_runtime_files="$({
            git ls-files |
              grep -E '(^|/)(\.env(\..+)?|[^/]+\.(db|sqlite|sqlite3)(-(journal|shm|wal))?|[^/]+\.log)$' |
              grep -v -E '(^|/)\.env\.example$'
          } || true)"

          if [ -n "$tracked_runtime_files" ]; then
            echo "Runtime data must not be committed:"
            printf '%s\n' "$tracked_runtime_files"
            exit 1
          fi

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

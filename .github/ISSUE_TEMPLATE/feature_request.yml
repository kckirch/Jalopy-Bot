name: Feature request
description: Suggest a focused improvement to JalopyBot
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this idea.
          required: true
        - label: This request does not include credentials or private user data.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this change solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful behavior change.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or other approaches you considered.

  - type: textarea
    id: impact
    attributes:
      label: Deployment or data impact
      description: Note any database, configuration, Discord command, or API compatibility concerns.
